<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마법기사 키우기 - 슬롯 강화 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            grade: {
              normal: '#9ca3af',
              rare: '#60a5fa',
              epic: '#a78bfa',
              legendary: '#fbbf24',
              ancient: '#ef4444',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    @keyframes glow { 0%,100%{box-shadow:0 0 5px rgba(99,102,241,0.5)} 50%{box-shadow:0 0 20px rgba(99,102,241,0.8)} }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.15)} 100%{transform:scale(1)} }
    @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    @keyframes milestoneUnlock { 0%{transform:scale(0.8);opacity:0} 50%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
    .shake { animation: shake 0.3s ease-in-out; }
    .glow { animation: glow 0.6s ease-in-out; }
    .pop { animation: pop 0.3s ease-out; }
    .slide-in { animation: slideIn 0.3s ease-out; }
    .milestone-unlock { animation: milestoneUnlock 0.5s ease-out; }
    .star { color: #fbbf24; text-shadow: 0 0 6px rgba(251,191,36,0.6); }

    /* Equipment Grid */
    .equip-grid {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(5, 80px);
      gap: 6px;
      justify-content: center;
      grid-template-areas:
        ".     hat   ."
        "ear   .     neck"
        "wep   robe  cloak"
        "glove bot   ring"
        ".     shoe  .";
    }
    .equip-cell {
      border: 2px solid #475569;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.9);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      position: relative;
    }
    .equip-cell:hover { border-color: rgba(99,102,241,0.6); background: rgba(51,65,85,0.9); }
    .equip-cell.selected { border-color: #6366f1; box-shadow: 0 0 14px rgba(99,102,241,0.4); background: rgba(67,56,202,0.15); }
    .equip-cell.max-level { border-color: rgba(251,191,36,0.5); }
    .equip-cell.max-level.selected { border-color: #fbbf24; box-shadow: 0 0 14px rgba(251,191,36,0.4); }

    /* Milestone tab */
    .ms-tab {
      padding: 5px 8px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      border-bottom: none;
      font-size: 11px;
      font-weight: 600;
      user-select: none;
      white-space: nowrap;
    }
    .ms-tab.active { background: #1e293b; border-color: #475569; color: #e2e8f0; }
    .ms-tab.locked { opacity: 0.4; cursor: not-allowed; }
    .ms-tab:not(.active):not(.locked):hover { background: rgba(51,65,85,0.5); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    body { font-family: 'Segoe UI', sans-serif; }

    .grade-normal { color: #9ca3af; }
    .grade-rare { color: #60a5fa; }
    .grade-epic { color: #a78bfa; }
    .grade-legendary { color: #fbbf24; }
    .grade-ancient { color: #ef4444; }
    .grade-bg-normal { background: rgba(156,163,175,0.15); border-color: #9ca3af; }
    .grade-bg-rare { background: rgba(96,165,250,0.15); border-color: #60a5fa; }
    .grade-bg-epic { background: rgba(167,139,250,0.15); border-color: #a78bfa; }
    .grade-bg-legendary { background: rgba(251,191,36,0.15); border-color: #fbbf24; }
    .grade-bg-ancient { background: rgba(239,68,68,0.15); border-color: #ef4444; }

    /* MS dot indicators on equip cells */
    .ms-dots { display: flex; gap: 2px; margin-top: 2px; }
    .ms-dot { width: 6px; height: 6px; border-radius: 50%; }
    .ms-dot.open { background: #22c55e; }
    .ms-dot.locked { background: #475569; }
  </style>
</head>

  function initState() {

  // ============================================================
  // TABLE LOOKUP
  // ============================================================
  function getEnhanceRow(slotId, level) {
    return T_SLOT_ENHANCE.find(r => r.slotId === slotId && r.level === level)
        || T_SLOT_ENHANCE.find(r => r.slotId === 'ALL' && r.level === level);
  }

  function getStarCount(slotId, level) {
    let stars = 0;
    T_SLOT_MILESTONE.forEach(m => {
      if ((m.slotId === slotId || m.slotId === 'ALL') && level >= m.level) {
        stars = Math.max(stars, m.starDisplay);
      }
    });
    return stars;
  }

  function getTotalLevel() {
    return Object.values(state.slots).reduce((sum, s) => sum + s.level, 0);
  }

  function getNearestGradeLevel(enhanceLevel) {
    const levels = [...new Set(T_MILESTONE_GRADE_RATE.map(r => r.enhanceLevel))].sort((a, b) => a - b);
    let best = levels[0];
    for (const l of levels) {
      if (l <= enhanceLevel) best = l;
    }
    return best;
  }

  function getRerollRow(milestoneLevel) {
    return T_MILESTONE_REROLL.find(r => String(r.milestoneLevel) === String(milestoneLevel))
        || T_MILESTONE_REROLL.find(r => r.milestoneLevel === 'ALL');
  }

  function isMilestoneSlotOpen(slotId, msId) {
    return state.milestoneSlots[slotId][msId].length > 0;
  }

  function getMilestoneSlotOpenCount(slotId) {
    let count = 0;
    MILESTONE_SLOT_CONFIG.forEach(c => {
      if (state.milestoneSlots[slotId][c.id].length > 0) count++;
    });
    return count;
  }

  // ============================================================
  // GRADE ROLLING
  // ============================================================
  function weightedRandom(items, weightFn) {
    const totalWeight = items.reduce((sum, item) => sum + weightFn(item), 0);
    if (totalWeight <= 0) return items[0];
    let rand = Math.random() * totalWeight;
    for (const item of items) {
      rand -= weightFn(item);
      if (rand <= 0) return item;
    }
    return items[items.length - 1];
  }

  function rollMilestoneStat(milestoneLevel, enhanceLevel) {
    // Step 1: Get pool for this milestoneLevel
    const poolEntries = T_MILESTONE_STAT_POOL.filter(p => p.milestoneLevel === milestoneLevel);
    if (poolEntries.length === 0) return null;

    // Step 2: Pick statType (weighted)
    const statTypes = [...new Set(poolEntries.map(p => p.statType))];
    const chosenStatType = weightedRandom(
      statTypes.map(st => ({ statType: st, weight: poolEntries.find(p => p.statType === st).weight })),
      item => item.weight
    ).statType;

    // Step 3: Pick grade (rate-based, using nearest grade level)
    const gradeLevel = getNearestGradeLevel(enhanceLevel);
    const gradeRates = T_MILESTONE_GRADE_RATE.filter(g => g.enhanceLevel === gradeLevel);
    if (gradeRates.length === 0) return null;
    const chosenGrade = weightedRandom(gradeRates, item => item.rate).grade;

    // Step 4: Look up value
    const entry = poolEntries.find(p => p.statType === chosenStatType && p.grade === chosenGrade);
    if (!entry) return null;

    return { statType: chosenStatType, grade: chosenGrade, statValue: entry.statValue };
  }

  // ============================================================
  // ENHANCEMENT LOGIC
  // ============================================================
  function canAfford(row) {
    if (state.infiniteMode) return true;
    if (row.costAmount1 > 0 && (state.inventory[row.costType1] || 0) < row.costAmount1) return false;
    if (row.costAmount2 > 0 && (state.inventory[row.costType2] || 0) < row.costAmount2) return false;
    return true;
  }

  function deductCost(row) {
    if (state.infiniteMode) return;
    if (row.costAmount1 > 0) state.inventory[row.costType1] -= row.costAmount1;
    if (row.costAmount2 > 0) state.inventory[row.costType2] -= row.costAmount2;
    state.stats.totalStoneSpent += row.costAmount1;
    state.stats.totalGoldSpent += row.costAmount2;
  }

  function doEnhance(slotId) {
    const slot = state.slots[slotId];
    const slotInfo = T_EQUIP_SLOT.find(s => s.slotId === slotId);
    if (slot.level >= slotInfo.maxEnhanceLevel) return { type: 'max' };

    const targetLevel = slot.level + 1;
    const row = getEnhanceRow(slotId, targetLevel);
    if (!row) return { type: 'error', msg: 'No enhance data' };
    if (!canAfford(row)) return { type: 'poor' };

    deductCost(row);
    state.stats.totalAttempts++;

    let success = false;
    let actualRate = row.successRate;
    if (row.isSafe) {
      success = true;
      actualRate = 1.0;
    } else {
      actualRate = Math.min(1.0, row.successRate + slot.failStreak * row.failBonusRate);
      success = Math.random() < actualRate;
    }

    const result = {
      slotId, slotName: slotInfo.slotName,
      fromLevel: slot.level, targetLevel, actualRate,
      isSafe: row.isSafe, costStone: row.costAmount1, costGold: row.costAmount2,
      failType: row.failType, milestone: null, milestoneSlotOpened: null,
      milestoneNewStats: [], totalMilestone: null,
    };

    if (success) {
      result.type = 'success';
      slot.level = targetLevel;
      slot.failStreak = 0;
      state.stats.totalSuccess++;

      // Check for milestone slot openings
      MILESTONE_SLOT_CONFIG.forEach(config => {
        if (targetLevel === config.unlockLevel && state.milestoneSlots[slotId][config.id].length === 0) {
          // Open milestone slot - roll all stats
          const newStats = [];
          for (let i = 0; i < config.statCount; i++) {
            const stat = rollMilestoneStat(config.unlockLevel, targetLevel);
            if (stat) {
              const entry = { ...stat, locked: false };
              state.milestoneSlots[slotId][config.id].push(entry);
              newStats.push(entry);
            }
          }
          result.milestoneSlotOpened = config;
          result.milestoneNewStats = newStats;
        }
      });

      // Check star milestone (visual only)
      const milestone = T_SLOT_MILESTONE.find(m =>
        (m.slotId === slotId || m.slotId === 'ALL') && m.level === targetLevel);
      if (milestone) result.milestone = milestone;

      // Check total milestone
      const total = getTotalLevel();
      T_SLOT_TOTAL_MILESTONE.forEach(tm => {
        if (total >= tm.totalLevel && !state.achievedTotalMilestones.has(tm.totalLevel)) {
          state.achievedTotalMilestones.add(tm.totalLevel);
          result.totalMilestone = tm;
        }
      });
    } else {
      result.type = 'fail';
      state.stats.totalFail++;
      slot.failStreak++;
      if (row.failType === 'DOWN_1') {
        slot.level = Math.max(0, slot.level - 1);
        result.newLevel = slot.level;
      } else if (row.failType === 'RESET') {
        slot.level = 0;
        result.newLevel = 0;
      }
    }

    return result;
  }

  function doBatchEnhance(slotId, count) {
    const results = [];
    for (let i = 0; i < count; i++) {
      const r = doEnhance(slotId);
      results.push(r);
      if (r.type === 'max' || r.type === 'poor' || r.type === 'error') break;
    }
    return results;
  }

  // ============================================================
  // REROLL LOGIC (per milestone sub-slot)
  // ============================================================
  function calcRerollCost(slotId, msSlotId) {
    const stats = state.milestoneSlots[slotId]?.[msSlotId];
    if (!stats || stats.length === 0) return null;

    const config = MILESTONE_SLOT_CONFIG.find(c => c.id === msSlotId);
    const row = getRerollRow(config.unlockLevel);
    if (!row) return null;

    const lockedCount = stats.filter(s => s.locked).length;
    const unlockedCount = stats.length - lockedCount;
    if (unlockedCount === 0) return null;

    const costs = {};
    if (row.rerollCostType1 && row.rerollCostAmount1 > 0) {
      costs[row.rerollCostType1] = (costs[row.rerollCostType1] || 0) + row.rerollCostAmount1;
    }
    if (row.rerollCostType2 && row.rerollCostAmount2 > 0) {
      costs[row.rerollCostType2] = (costs[row.rerollCostType2] || 0) + row.rerollCostAmount2;
    }
    if (lockedCount > 0) {
      if (row.lockCostType1 && row.lockCostAmount1 > 0) {
        costs[row.lockCostType1] = (costs[row.lockCostType1] || 0) + row.lockCostAmount1 * lockedCount;
      }
      if (row.lockCostType2 && row.lockCostAmount2 > 0) {
        costs[row.lockCostType2] = (costs[row.lockCostType2] || 0) + row.lockCostAmount2 * lockedCount;
      }
    }
    return { costs, lockedCount, unlockedCount };
  }

  function canAffordReroll(costInfo) {
    if (state.infiniteMode) return true;
    for (const [type, amount] of Object.entries(costInfo.costs)) {
      if ((state.inventory[type] || 0) < amount) return false;
    }
    return true;
  }

  function doReroll(slotId, msSlotId) {
    const costInfo = calcRerollCost(slotId, msSlotId);
    if (!costInfo) return false;
    if (!canAffordReroll(costInfo)) return false;

    if (!state.infiniteMode) {
      for (const [type, amount] of Object.entries(costInfo.costs)) {
        state.inventory[type] -= amount;
      }
    }
    state.stats.totalRerolls++;

    const config = MILESTONE_SLOT_CONFIG.find(c => c.id === msSlotId);
    const slot = state.slots[slotId];
    const stats = state.milestoneSlots[slotId][msSlotId];

    stats.forEach(stat => {
      if (!stat.locked) {
        const newStat = rollMilestoneStat(config.unlockLevel, slot.level);
        if (newStat) {
          stat.statType = newStat.statType;
          stat.grade = newStat.grade;
          stat.statValue = newStat.statValue;
        }
      }
    });

    return true;
  }

  // ============================================================
  // AGGREGATE STATS
  // ============================================================
  function getAllMilestoneStats() {
    const allStats = [];
    Object.entries(state.milestoneSlots).forEach(([slotId, msSlots]) => {
      Object.entries(msSlots).forEach(([msId, stats]) => {
        stats.forEach(stat => {
          allStats.push({ slotId, milestoneSlotId: parseInt(msId), ...stat });
        });
      });
    });
    return allStats;
  }

  function getAggregatedStats() {
    const allStats = getAllMilestoneStats();
    const agg = {};
    allStats.forEach(s => {
      if (!agg[s.statType]) agg[s.statType] = { total: 0, count: 0, grades: {} };
      agg[s.statType].total += s.statValue;
      agg[s.statType].count++;
      agg[s.statType].grades[s.grade] = (agg[s.statType].grades[s.grade] || 0) + 1;
    });
    return agg;
  }

  function renderMilestoneTabs(slotId) {
    const slot = state.slots[slotId];
    const activeTab = state.activeMilestoneTab;

    // Tab buttons
    const tabsHtml = MILESTONE_SLOT_CONFIG.map(config => {
      const isOpen = state.milestoneSlots[slotId][config.id].length > 0;
      const isActive = activeTab === config.id;
      const isLocked = !isOpen;

      return `
        <div class="ms-tab ${isActive ? 'active' : ''} ${isLocked ? 'locked' : ''} text-slate-400"
             onclick="${isLocked ? `showLockedMsg(${config.unlockLevel})` : `switchMilestoneTab(${config.id})`}">
          ${isLocked ? '🔒 ' : ''}${config.label} ${isOpen ? `(${config.statCount})` : ''}
        </div>`;
    }).join('');

    // Active tab content
    const activeConfig = MILESTONE_SLOT_CONFIG.find(c => c.id === activeTab);
    const isOpen = state.milestoneSlots[slotId][activeTab].length > 0;
    let contentHtml = '';

    if (!isOpen) {
      // Locked state
      contentHtml = `
        <div class="bg-slate-800/50 rounded-b-xl border border-slate-700 border-t-0 p-6 text-center">
          <div class="text-4xl mb-3 opacity-30">🔒</div>
          <p class="text-slate-400 font-semibold">Lv.${activeConfig.unlockLevel} 도달 시 해금</p>
          <p class="text-slate-500 text-sm mt-1">현재 Lv.${slot.level} / 필요 Lv.${activeConfig.unlockLevel}</p>
          <div class="w-full bg-slate-700 rounded-full h-2 mt-3 max-w-xs mx-auto">
            <div class="bg-indigo-500 h-2 rounded-full transition-all" style="width:${Math.min(100, slot.level / activeConfig.unlockLevel * 100).toFixed(0)}%"></div>
          </div>
          <p class="text-slate-500 text-xs mt-2">해금 시 마일스톤 스텟 ${activeConfig.statCount}개 획득</p>
        </div>`;
    } else {
      // Open - show stats + reroll
      const stats = state.milestoneSlots[slotId][activeTab];
      const costInfo = calcRerollCost(slotId, activeTab);
      const canReroll = costInfo && (state.infiniteMode || canAffordReroll(costInfo));
      const allLocked = costInfo && costInfo.unlockedCount === 0;
      const costDisplayHtml = costInfo
        ? Object.entries(costInfo.costs).map(([t, a]) =>
          `<span class="${t === 'PROTECT_STONE' ? 'text-emerald-400' : t === 'GOLD' ? 'text-yellow-300' : 'text-yellow-400'}">${COST_ICONS[t] || t} ${a.toLocaleString()}</span>`
        ).join(' ')
        : '';

      // Grade rate info for current level
      const gradeLevel = getNearestGradeLevel(slot.level);
      const gradeRates = T_MILESTONE_GRADE_RATE.filter(g => g.enhanceLevel === gradeLevel);

      contentHtml = `
        <div class="bg-slate-800 rounded-b-xl border border-slate-700 border-t-0 p-4">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs text-slate-500">클릭하여 잠금/해제</span>
            <span class="text-xs text-slate-500">리롤 등급 참조: Lv.${gradeLevel}</span>
          </div>
          <div class="space-y-1.5 mb-3">
            ${stats.map((ms, idx) => `
              <div class="flex items-center gap-2 text-sm grade-bg-${ms.grade.toLowerCase()} border rounded px-3 py-1.5 cursor-pointer transition-all ${ms.locked ? 'ring-2 ring-emerald-500/50' : 'hover:brightness-110'}"
                   onclick="toggleLock('${slotId}', ${activeTab}, ${idx})">
                <span class="text-lg flex-shrink-0">${ms.locked ? '🔒' : '🔓'}</span>
                <div class="flex-1 flex items-center justify-between">
                  <div>
                    <span class="grade-${ms.grade.toLowerCase()} font-semibold">[${GRADE_NAMES[ms.grade]}]</span>
                    <span class="text-slate-200 ml-1">${STAT_NAMES[ms.statType]}</span>
                  </div>
                  <span class="grade-${ms.grade.toLowerCase()} font-bold">+${(ms.statValue * 100).toFixed(1)}%</span>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="border-t border-slate-700 pt-3">
            ${gradeRates.length > 0 ? `
            <div class="flex gap-1 mb-2 flex-wrap">
              ${gradeRates.filter(g => g.rate > 0).map(g => `
                <span class="text-[10px] px-1.5 py-0.5 rounded grade-bg-${g.grade.toLowerCase()} border grade-${g.grade.toLowerCase()}">${GRADE_NAMES[g.grade]} ${(g.rate*100).toFixed(0)}%</span>
              `).join('')}
            </div>` : ''}
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs text-slate-400">리롤 비용</span>
              <div class="text-xs flex gap-2">${costDisplayHtml}</div>
            </div>
            ${costInfo && costInfo.lockedCount > 0 ? `<div class="text-xs text-emerald-400 mb-2">잠금 ${costInfo.lockedCount}개 적용 중</div>` : ''}
            <button onclick="rerollStats()"
              class="w-full py-2 ${allLocked ? 'bg-slate-700 text-slate-500 cursor-not-allowed' : canReroll ? 'bg-teal-600 hover:bg-teal-500 active:bg-teal-700 text-white' : 'bg-slate-700 text-slate-500 cursor-not-allowed'} font-bold rounded-lg transition-colors"
              ${allLocked || !canReroll ? 'disabled' : ''}>
              ${allLocked ? '최소 1개는 잠금 해제 필요' : canReroll ? '🔄 리롤' : '재화 부족'}
            </button>
          </div>
        </div>`;
    }

    return `
      <div class="mt-4">
        <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">마일스톤 슬롯</h3>
        <div class="flex flex-wrap gap-y-1">${tabsHtml}</div>
        ${contentHtml}
      </div>`;
  }

  // ============================================================
  // LOG
  // ============================================================
  function addLog(result) {
    const log = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    let line = '';
    let cls = '';

    if (result.type === 'success') {
      cls = 'text-green-400';
      line = `[${time}] ✅ ${result.slotName} Lv.${result.fromLevel}→${result.targetLevel} 성공! (${(result.actualRate*100).toFixed(1)}%)${result.isSafe ? ' [안전]' : ''}`;
    } else if (result.type === 'fail') {
      cls = 'text-red-400';
      const penalty = result.failType === 'KEEP' ? '' : result.failType === 'DOWN_1' ? ` [Lv.${result.newLevel}로 하락]` : ' [Lv.0으로 초기화]';
      line = `[${time}] ❌ ${result.slotName} Lv.${result.fromLevel}→${result.targetLevel} 실패 (${(result.actualRate*100).toFixed(1)}%)${penalty}`;
    } else if (result.type === 'poor') {
      cls = 'text-yellow-400';
      line = `[${time}] ⚠️ 재화 부족!`;
    } else if (result.type === 'max') {
      cls = 'text-yellow-400';
      line = `[${time}] 🏆 ${result.slotName || ''} 이미 최대 레벨입니다`;
    }

    const div = document.createElement('div');
    div.className = `${cls} slide-in`;
    div.textContent = line;
    log.prepend(div);

    // Milestone slot opened log
    if (result.milestoneSlotOpened) {
      const config = result.milestoneSlotOpened;
      const msDiv = document.createElement('div');
      msDiv.className = 'text-indigo-400 font-bold slide-in';
      msDiv.textContent = `[${time}]    🎰 마일스톤 슬롯 해금! ${config.label} (스텟 ${config.statCount}개)`;
      log.prepend(msDiv);

      result.milestoneNewStats.forEach(ms => {
        const statDiv = document.createElement('div');
        statDiv.className = `grade-${ms.grade.toLowerCase()} slide-in ml-4`;
        statDiv.textContent = `[${time}]       → [${GRADE_NAMES[ms.grade]}] ${STAT_NAMES[ms.statType]} +${(ms.statValue*100).toFixed(1)}%`;
        log.prepend(statDiv);
      });
    }

    if (result.totalMilestone) {
      const tm = result.totalMilestone;
      const tmDiv = document.createElement('div');
      tmDiv.className = 'text-indigo-400 font-bold slide-in';
      tmDiv.textContent = `[${time}]    🏅 전체 합산 마일스톤 달성! Lv.${tm.totalLevel} - ${tm.bonusDesc}${tm.titleReward ? ` [칭호: ${tm.titleReward}]` : ''}`;
      log.prepend(tmDiv);
    }

    while (log.children.length > 500) log.removeChild(log.lastChild);
  }

  function addBatchLog(results) {
    const log = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
    const successes = results.filter(r => r.type === 'success').length;
    const fails = results.filter(r => r.type === 'fail').length;
    const total = successes + fails;

    if (total > 0) {
      const slotName = results[0].slotName;
      const startLevel = results[0].fromLevel;
      const endLevel = state.slots[results[0].slotId].level;

      const div = document.createElement('div');
      div.className = 'text-violet-400 font-bold slide-in border-b border-slate-700 pb-1 mb-1';
      div.textContent = `[${time}] 🔟 ${slotName} 10연속 결과: ${total}회 시도, 성공 ${successes}회, 실패 ${fails}회 (Lv.${startLevel}→${endLevel})`;
      log.prepend(div);

      // Log milestone slot openings and total milestones
      results.forEach(r => {
        if (r.totalMilestone) {
          const tmDiv = document.createElement('div');
          tmDiv.className = 'text-indigo-400 font-bold slide-in';
          tmDiv.textContent = `[${time}]    🏅 전체 합산 마일스톤 달성! Lv.${r.totalMilestone.totalLevel} - ${r.totalMilestone.bonusDesc}`;
          log.prepend(tmDiv);
        }
        if (r.milestoneSlotOpened) {
          const config = r.milestoneSlotOpened;
          const msDiv = document.createElement('div');
          msDiv.className = 'text-indigo-400 font-bold slide-in';
          msDiv.textContent = `[${time}]    🎰 마일스톤 슬롯 해금! ${config.label} (스텟 ${config.statCount}개)`;
          log.prepend(msDiv);

          r.milestoneNewStats.forEach(ms => {
            const statDiv = document.createElement('div');
            statDiv.className = `grade-${ms.grade.toLowerCase()} slide-in ml-4`;
            statDiv.textContent = `[${time}]       → [${GRADE_NAMES[ms.grade]}] ${STAT_NAMES[ms.statType]} +${(ms.statValue*100).toFixed(1)}%`;
            log.prepend(statDiv);
          });
        }
      });
    }
  }

  function clearLog() {
    document.getElementById('logArea').innerHTML = '';
  }

  // ============================================================
  // USER ACTIONS
  // ============================================================
  function selectSlot(slotId) {
    state.selectedSlotId = slotId;
    // Auto-switch to first available milestone tab
    state.activeMilestoneTab = 1;
    for (let i = MILESTONE_SLOT_CONFIG.length; i >= 1; i--) {
      if (state.milestoneSlots[slotId][i].length > 0) {
        state.activeMilestoneTab = i;
        break;
      }
    }
    renderAll();
  }

  function enhanceOne() {
    if (!state.selectedSlotId) return;
    const result = doEnhance(state.selectedSlotId);
    addLog(result);

    // Auto-switch to newly opened milestone tab
    if (result.milestoneSlotOpened) {
      state.activeMilestoneTab = result.milestoneSlotOpened.id;
    }

    renderAll();

    const btn = document.getElementById('enhanceBtn');
    if (btn) {
      btn.classList.add(result.type === 'success' ? 'pop' : 'shake');
      setTimeout(() => btn.classList.remove('pop', 'shake'), 400);
    }
  }

  function enhanceTen() {
    if (!state.selectedSlotId) return;
    const results = doBatchEnhance(state.selectedSlotId, 10);
    addBatchLog(results);

    // Auto-switch to latest opened milestone tab
    const lastOpened = results.filter(r => r.milestoneSlotOpened).pop();
    if (lastOpened) {
      state.activeMilestoneTab = lastOpened.milestoneSlotOpened.id;
    }

    renderAll();
  }

  function switchMilestoneTab(tabId) {
    state.activeMilestoneTab = tabId;
    renderEnhancePanel();
  }

  function showLockedMsg(unlockLevel) {
    // Switch to this tab anyway to show the locked message
    const config = MILESTONE_SLOT_CONFIG.find(c => c.unlockLevel === unlockLevel);
    if (config) {
      state.activeMilestoneTab = config.id;
      renderEnhancePanel();
    }
  }

  function toggleLock(slotId, msSlotId, statIdx) {
    const stats = state.milestoneSlots[slotId][msSlotId];
    if (stats[statIdx]) {
      stats[statIdx].locked = !stats[statIdx].locked;
      renderEnhancePanel();
      renderMilestoneStatsPanel();
    }
  }

  function rerollStats() {
    if (!state.selectedSlotId) return;
    const success = doReroll(state.selectedSlotId, state.activeMilestoneTab);
    if (success) {
      const log = document.getElementById('logArea');
      const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
      const slotName = T_EQUIP_SLOT.find(s => s.slotId === state.selectedSlotId)?.slotName || '';
      const config = MILESTONE_SLOT_CONFIG.find(c => c.id === state.activeMilestoneTab);
      const stats = state.milestoneSlots[state.selectedSlotId][state.activeMilestoneTab].filter(s => !s.locked);

      const div = document.createElement('div');
      div.className = 'text-teal-400 font-bold slide-in border-b border-slate-700 pb-1 mb-1';
      div.textContent = `[${time}] 🔄 ${slotName} ${config.label} 리롤 완료!`;
      log.prepend(div);

      stats.forEach(ms => {
        const msDiv = document.createElement('div');
        msDiv.className = `grade-${ms.grade.toLowerCase()} slide-in`;
        msDiv.textContent = `[${time}]    → [${GRADE_NAMES[ms.grade]}] ${STAT_NAMES[ms.statType]} +${(ms.statValue*100).toFixed(1)}%`;
        log.prepend(msDiv);
      });

      renderAll();
    }
  }

  function toggleSlotBreakdown() {
    const el = document.getElementById('slotBreakdown');
    const toggle = document.getElementById('breakdownToggle');
    if (el.classList.contains('hidden')) {
      el.classList.remove('hidden');
      toggle.textContent = '▲ 슬롯별 상세 숨기기';
    } else {
      el.classList.add('hidden');
      toggle.textContent = '▼ 슬롯별 상세보기';
    }
  }

  function resetAll() {
    if (!confirm('모든 데이터를 초기화하시겠습니까?')) return;
    initState();
    clearLog();
    renderAll();
  }

  function toggleInfinite() {
    state.infiniteMode = !state.infiniteMode;
    const btn = document.getElementById('infiniteBtn');
    if (state.infiniteMode) {
      btn.textContent = '무한 재화 ON';
      btn.className = 'px-3 py-1 bg-green-900/50 hover:bg-green-900 text-green-300 rounded text-sm border border-green-700';
    } else {
      btn.textContent = '무한 재화 OFF';
      btn.className = 'px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded text-sm border border-slate-600';
    }
    renderInventory();
  }

  // ============================================================
  // KEYBOARD SHORTCUTS
  // ============================================================
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      enhanceOne();
    }
    if (e.key === 'q' || e.key === 'Q') {
      enhanceTen();
    }
    // Tab switching: 1~6
    if (e.key >= '1' && e.key <= '6') switchMilestoneTab(parseInt(e.key));
  });

  // ============================================================
  // INIT
  // ============================================================
  initState();
  renderAll();
  </script>

</body>
</html>
